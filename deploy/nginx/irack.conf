# ==============================================================================
#  iRACK IT Solution — Production Nginx Server Block (HTTP -> HTTPS + PHP-FPM)
# ==============================================================================

# Redirect all HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name irack.com www.irack.com showroom.irack.com admin.irack.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Secure HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irack.com www.irack.com showroom.irack.com admin.irack.com;

    # SSL TLS Configuration
    ssl_certificate /etc/letsencrypt/live/irack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Hardened Security Response Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # Maximum file upload size (PDF datasheets & high-res images)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Frontend Vue.js SPA Static Root
    root /var/www/irack/frontend/dist;
    index index.html;

    # Vue Router HTML5 History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (1 Year)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. Uploaded Media & Datasheets Direct Storage Passthrough
    location ^~ /storage/ {
        alias /var/www/irack/backend/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Backend Laravel REST API Routing & FastCGI
    location ^~ /api/ {
        root /var/www/irack/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/irack/backend/public/index.php;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 180s;
        }
    }

    # Sanctum CSRF Cookie Endpoint
    location = /sanctum/csrf-cookie {
        root /var/www/irack/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/irack/backend/public/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/irack_access.log;
    error_log /var/log/nginx/irack_error.log warn;
}
