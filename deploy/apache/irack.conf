# ==============================================================================
#  iRACK IT Solution — Production Apache 2.4 VirtualHost Configuration
# ==============================================================================

<VirtualHost *:80>
    ServerName irack.com
    ServerAlias www.irack.com showroom.irack.com admin.irack.com
    DocumentRoot /var/www/irack/frontend/dist

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName irack.com
    ServerAlias www.irack.com showroom.irack.com admin.irack.com
    DocumentRoot /var/www/irack/frontend/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/irack.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/irack.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Frontend Single Page Application Routing
    <Directory "/var/www/irack/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Allow API requests through
        RewriteRule ^api/ - [L]
        RewriteRule ^storage/ - [L]
        RewriteRule ^sanctum/ - [L]

        # Route remaining requests to index.html
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Uploaded Public Files Alias
    Alias /storage /var/www/irack/backend/storage/app/public
    <Directory "/var/www/irack/backend/storage/app/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Backend API Proxy via PHP-FPM
    Alias /api /var/www/irack/backend/public
    <Directory "/var/www/irack/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/irack_error.log
    CustomLog ${APACHE_LOG_DIR}/irack_access.log combined
</VirtualHost>
