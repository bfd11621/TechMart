    />

    <!-- Navy Diagonal Leg for "R" -->
    <path
      d="M94 124L164 204H122L68 138V124H94Z"
      fill="#042562"
    />
  </g>

  <!-- Wordmark: iRACK -->
  <g transform="translate(80, 0)">
    <text x="0" y="44" font-family="'Times New Roman', Times, serif" font-weight="900" font-size="44" fill="#E20913">i</text>
    <text x="18" y="44" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="-1" fill="#042562">RACK</text>
    <text x="2" y="66" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="4" fill="#042562">TECH-MART</text>
  </g>
