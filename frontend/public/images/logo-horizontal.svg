<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <!-- Monogram Symbol (Left) -->
  <g transform="translate(10, 5) scale(0.32)">
    <!-- Red Dot for "i" -->
    <circle cx="50" cy="34" r="20" fill="#E20913" />

    <!-- Vertical Navy Stem for "i" -->
    <rect x="32" y="68" width="36" height="136" rx="4" fill="#042562" />

    <!-- Corporate Blue Curved Loop for "R" -->
    <path
      d="M68 68H126C156 68 172 84 172 106C172 128 156 144 126 144H68V68ZM68 98V114H118C132 114 142 111 142 106C142 101 132 98 118 98H68Z"
      fill-rule="evenodd"
